name: Check Loon plugins

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Plugin checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify jq 1.8.2
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          curl --proto '=https' --fail --location --silent --show-error --retry 2 \
            https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-linux-amd64 -o jq
          echo 'b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f  jq' | sha256sum --check
          chmod +x jq

      - name: Test published plugins
        env:
          JQ: ${{ runner.temp }}/jq
        run: python3 -B -m unittest discover -s tests -v

      - name: Test the Safari helpers with simulated pages
        run: |
          python3 -m venv "$RUNNER_TEMP/checkin-tests"
          "$RUNNER_TEMP/checkin-tests/bin/python" -m pip install --only-binary=:all: playwright==1.58.0
          "$RUNNER_TEMP/checkin-tests/bin/python" tests/checkin_browser.py
          "$RUNNER_TEMP/checkin-tests/bin/python" tests/youtube_browser.py
