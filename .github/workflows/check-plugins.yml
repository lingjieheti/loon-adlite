name: Check Loon plugins

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      candidate:
        type: string
        required: true
      release_base:
        type: string
        required: true
      upstream:
        type: string
        required: true

permissions:
  contents: read

jobs:
  validate:
    name: Plugin checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate || github.sha }}
          fetch-depth: 0 # Compare the candidate with the published base.
          persist-credentials: false

      - name: Verify jq 1.8.2
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          curl --proto '=https' --fail --location --silent --show-error --retry 2 \
            https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-linux-amd64 -o jq
          echo 'b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f  jq' | sha256sum --check
          chmod +x jq

      - name: Resolve the previous release for version checks
        if: github.event_name == 'push'
        env:
          PREVIOUS: ${{ github.event.before }}
        run: |
          if [[ "$PREVIOUS" == 0000000000000000000000000000000000000000 ]]; then
            echo "PUSH_BASE=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
          elif git cat-file -e "$PREVIOUS^{commit}" 2>/dev/null; then
            echo "PUSH_BASE=$PREVIOUS" >> "$GITHUB_ENV"
          else
            # Rewritten branch tips can have a previous release outside the checked-out history.
            git fetch --no-tags --depth=1 origin "$PREVIOUS"
            echo "PUSH_BASE=$PREVIOUS" >> "$GITHUB_ENV"
          fi

      - name: Audit the release and record its security scope
        env:
          RELEASE_BASE: ${{ inputs.release_base || github.event.pull_request.base.sha || env.PUSH_BASE }}
          MANAGED_CANDIDATE: ${{ inputs.candidate }}
          UPSTREAM: ${{ inputs.upstream }}
        run: |
          args=(--base "$RELEASE_BASE" --head HEAD)
          if [[ -n "$MANAGED_CANDIDATE" ]]; then
            [[ "$UPSTREAM" =~ ^[0-9a-f]{40}$ ]]
            args+=(--upstream "$UPSTREAM")
            if [[ "$MANAGED_CANDIDATE" != "$RELEASE_BASE" ]]; then args+=(--managed); fi
          fi
          python3 -B .github/scripts/audit_release.py "${args[@]}"

      - name: Test published plugins
        env:
          JQ: ${{ runner.temp }}/jq
          RELEASE_BASE: ${{ inputs.release_base || github.event.pull_request.base.sha || env.PUSH_BASE }}
        run: python3 -B -m unittest discover -s tests -v

      - name: Test the Safari helpers with simulated pages
        run: |
          python3 -m venv "$RUNNER_TEMP/adblock-tests"
          "$RUNNER_TEMP/adblock-tests/bin/python" -m pip install --only-binary=:all: playwright==1.58.0
          "$RUNNER_TEMP/adblock-tests/bin/python" tests/youtube_browser.py
          "$RUNNER_TEMP/adblock-tests/bin/python" tests/web_ads_browser.py
          "$RUNNER_TEMP/adblock-tests/bin/python" -m playwright install --with-deps webkit
          YOUTUBE_TEST_BROWSER=webkit "$RUNNER_TEMP/adblock-tests/bin/python" tests/youtube_browser.py
          WEB_ADS_TEST_BROWSER=webkit "$RUNNER_TEMP/adblock-tests/bin/python" tests/web_ads_browser.py
